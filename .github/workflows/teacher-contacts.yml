# Контакты преподавателей с сайта вуза (scripts/teacher_contacts.py).
# Запуск вручную: Actions -> teacher-contacts -> Run workflow. Обновлённый data/teachers.json
# кладётся в ветку teacher-contacts/<номер запуска>, из неё открывается PR.
# С галочкой «только отчёт» файл не меняется, в логе отчёт о найденном.
# На PR не запускается: сайт вуза иногда не отвечает, и проверка краснела бы не из-за кода
# (разбор карточек проверяют тесты в tests/test_teacher_contacts.py).
# Нужен потому, что сайт вуза открывается не отовсюду, а с серверов GitHub открывается.
name: teacher-contacts

on:
  pull_request:
    paths: [scripts/teacher_contacts.py]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только отчёт, файл не менять"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx==0.28.1
      - name: debug
        if: github.event_name == 'pull_request'
        run: |
          python scripts/teacher_contacts.py --dump https://gtsolifk.ru/obrazovanie/kafedri/todiki_tantsevalnogo_sporta/stav_01770 > a.txt
          grep -n -m1 -A140 "Сингина" a.txt || head -c 6000 a.txt
          echo ====
          python scripts/teacher_contacts.py --dump https://gtsolifk.ru/obrazovanie/kafedri/pedagogiki > b.txt
          grep -n "Спицына" b.txt
          n=$(grep -n "Спицына" b.txt | tail -1 | cut -d: -f1); sed -n "$((n)),$((n+60))p" b.txt
          echo ====
          python scripts/teacher_contacts.py --dump https://gtsolifk.ru/obrazovanie/kafedri/todiki_tantsevalnogo_sporta | grep -n -i "состав\|stav\|сотрудник" | head
      - name: Пробный прогон
        if: inputs.dry_run || github.event_name == 'pull_request'
        run: python scripts/teacher_contacts.py --dry-run
      - name: Обновить и положить в ветку
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          python scripts/teacher_contacts.py
          if git diff --quiet; then echo "Изменений нет"; exit 0; fi
          branch="teacher-contacts/${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Контакты преподавателей с сайта вуза (запуск ${{ github.run_number }})"
          git push origin "$branch"
          echo "Ветка $branch: открой из неё PR в main"
